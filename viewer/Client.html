<script>
/* 画面側。DOMは textContent だけで組み立てる（innerHTML は使わない） */
var PMV = (function () {
  var SEARCH_COLS = [0, 1, 7, 8];          // 型番・商品CD・管理コード・U番号
  var FILTER_COLS = { status: 2, category: 4, destination: 5 };
  var TAB_STATE = { active: '有効', inactive: '無効' };

  /** サーバー側と同じ取込規則で正規化し、大文字にそろえる（全角/半角・大小を区別しない検索用） */
  function norm(s) {
    s = String(s == null ? '' : s).replace(/　/g, ' ');
    s = s.replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    s = s.replace(/[｡-ﾟ]+/g, function (m) { return m.normalize('NFKC'); });
    return s.trim().toUpperCase();
  }
  function terms(q) { return norm(q).split(/\s+/).filter(Boolean); }
  function inTab(row, tab) { return tab === 'all' || row.s === TAB_STATE[tab]; }
  /** 検索語はすべて（AND）、どれかの検索対象列に含まれること */
  function matches(row, ts, f) {
    for (var k in FILTER_COLS) if (f[k] && row.v[FILTER_COLS[k]] !== f[k]) return false;
    if (!row._key) row._key = SEARCH_COLS.map(function (i) { return norm(row.v[i]); });
    return ts.every(function (t) { return row._key.some(function (x) { return x.indexOf(t) >= 0; }); });
  }
  function filter(rows, tab, q, f) {
    var ts = terms(q);
    return rows.filter(function (r) { return inTab(r, tab) && matches(r, ts, f || {}); });
  }
  /** 値の取り出し（列: 数値=表示列, 'state'=管理状態, 'reason'=無効理由） */
  function cell(row, col) {
    if (col === 'hist') return row.h && row.h.length ? String(row.h.length) : '';
    return col === 'state' ? row.s : col === 'reason' ? row.reason : row.v[col];
  }
  /** 数字を数値として並べる自然順。空欄は常に末尾。同順位は元の並び（管理マスターの行順）を保つ */
  function sort(rows, col, dir) {
    if (col === null || col === undefined) return rows.slice();
    var sign = dir === 'desc' ? -1 : 1;
    return rows.map(function (r, i) { return { r: r, i: i }; }).sort(function (a, b) {
      var x = cell(a.r, col) || '', y = cell(b.r, col) || '';
      if (!x !== !y) return x ? -1 : 1;
      var c = x.localeCompare(y, 'ja', { numeric: true, sensitivity: 'base' });
      return c ? c * sign : a.i - b.i;
    }).map(function (o) { return o.r; });
  }
  /** 絞り込み候補（値の先頭の数字順） */
  function options(rows, key) {
    var seen = {}, out = [];
    rows.forEach(function (r) { var v = r.v[FILTER_COLS[key]]; if (v && !seen[v]) { seen[v] = true; out.push(v); } });
    return out.sort(function (a, b) { return a.localeCompare(b, 'ja', { numeric: true }); });
  }
  function columnsFor(tab, data) {
    var cols = data.columns.map(function (name, i) { return { key: i, name: name }; });
    if (tab === 'all') cols.push({ key: 'state', name: '管理状態' });
    if (data.showReason && tab !== 'active') cols.push({ key: 'reason', name: '無効理由' });
    cols.unshift({ key: 'hist', name: '履歴' });
    return cols;
  }
  /** 列幅（px）。保存値が無い列は既定値、範囲外は最小〜最大に収める */
  var WIDTH = { min: 48, max: 1200, def: 120 };
  function widthsFor(cols, saved) {
    return cols.map(function (c) {
      var w = Number(saved && saved[String(c.key)]);
      if (!isFinite(w) || w <= 0) w = WIDTH.def;
      return Math.min(WIDTH.max, Math.max(WIDTH.min, Math.round(w)));
    });
  }
  return { norm: norm, filter: filter, sort: sort, options: options, columnsFor: columnsFor, widthsFor: widthsFor, WIDTH: WIDTH };
})();

if (typeof document !== 'undefined') (function () {
  var data = null, tab = 'active', sortCol = null, sortDir = 'asc', seq = 0, open = {}, cols = [];
  /* 列幅はタブごとに、この閲覧者のブラウザにだけ保存する（保存できない環境では今回の表示だけ） */
  var WKEY = 'pmv.widths.v1', widths = {};
  try { widths = JSON.parse(window.localStorage.getItem(WKEY) || '{}') || {}; } catch (e) { widths = {}; }
  function saveWidths() { try { window.localStorage.setItem(WKEY, JSON.stringify(widths)); } catch (e) { /* 保存できなくても表示は続ける */ } }

  /** 保存済みの幅を <colgroup> に当てる。未設定のタブは自動幅 */
  function applyWidths() {
    var table = el('product-table'), saved = widths[tab], cg = el('cols');
    cg.replaceChildren();
    if (!saved) { table.classList.remove('fixed'); table.style.width = ''; cols.forEach(function () { cg.append(node('col')); }); el('reset-widths').hidden = true; return; }
    var ws = PMV.widthsFor(cols, saved), total = 0;
    ws.forEach(function (w) { var c = node('col'); c.style.width = w + 'px'; cg.append(c); total += w; });
    table.classList.add('fixed'); table.style.width = total + 'px';
    el('reset-widths').hidden = false;
  }
  /** 幅の調整を始めるとき、今の見た目の幅をそのタブの初期値として取り込む */
  function ensureWidths() {
    if (widths[tab]) return;
    var ths = el('head-row').children, w = {};
    cols.forEach(function (c, i) { w[String(c.key)] = Math.round(ths[i].getBoundingClientRect().width); });
    widths[tab] = w;
  }
  function setWidth(key, px) {
    ensureWidths();
    widths[tab][String(key)] = Math.min(PMV.WIDTH.max, Math.max(PMV.WIDTH.min, Math.round(px)));
    applyWidths();
  }
  function resetWidths() { delete widths[tab]; saveWidths(); applyWidths(); }

  function resizeHandle(c) {
    var h = node('span', undefined, 'col-resize');
    h.tabIndex = 0; h.title = 'ドラッグで幅を変更（ダブルクリックで元に戻す）';
    h.setAttribute('role', 'separator'); h.setAttribute('aria-orientation', 'vertical'); h.setAttribute('aria-label', c.name + 'の列幅');
    h.addEventListener('click', function (e) { e.stopPropagation(); });
    h.addEventListener('dblclick', function (e) { e.stopPropagation(); resetWidths(); });
    h.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      e.preventDefault(); e.stopPropagation();
      ensureWidths();
      var start = e.clientX, base = widths[tab][String(c.key)];
      h.setPointerCapture(e.pointerId); document.body.classList.add('resizing');
      function move(ev) { setWidth(c.key, base + ev.clientX - start); }
      function up() {
        h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
        document.body.classList.remove('resizing'); saveWidths();
      }
      h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    });
    h.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 16 : e.key === 'ArrowLeft' ? -16 : 0; if (!d) return;
      e.preventDefault(); ensureWidths(); setWidth(c.key, widths[tab][String(c.key)] + d); saveWidths();
    });
    return h;
  }
  function el(id) { return document.getElementById(id); }
  function node(tag, text, cls) { var n = document.createElement(tag); if (text !== undefined) n.textContent = String(text); if (cls) n.className = cls; return n; }
  function message(t) { el('message').textContent = t || ''; }
  function filters() { return { status: el('f-status').value, category: el('f-category').value, destination: el('f-destination').value }; }

  function fillSelect(id, values) {
    var s = el(id), keep = s.value;
    while (s.options.length > 1) s.remove(1);
    values.forEach(function (v) { var o = node('option', v); o.value = v; s.append(o); });
    s.value = values.indexOf(keep) >= 0 ? keep : '';
  }

  function renderHead(cols) {
    var tr = el('head-row'); tr.replaceChildren();
    cols.forEach(function (c) {
      var th = node('th'); th.scope = 'col';
      if (sortCol === c.key) th.setAttribute('aria-sort', sortDir === 'asc' ? 'ascending' : 'descending');
      var b = node('button', c.name); b.type = 'button'; b.title = c.name + 'で並べ替え';
      b.addEventListener('click', function () {
        if (sortCol === c.key) { if (sortDir === 'asc') sortDir = 'desc'; else { sortCol = null; sortDir = 'asc'; } }
        else { sortCol = c.key; sortDir = 'asc'; }
        render();
      });
      th.append(b, resizeHandle(c)); tr.append(th);
    });
  }

  function cellNode(row, c) {
    var td = node('td');
    if (c.key === 2) {
      var v = row.v[2];
      if (v) td.append(node('span', v, 'badge ' + (/^（未定義/.test(v) ? 'st-x' : 'st-' + row.code)));
    } else if (c.key === 'state') {
      td.append(node('span', row.s || '（空）', 'state ' + (row.s === '有効' ? 'state-active' : row.s === '無効' ? 'state-inactive' : 'state-other')));
    } else if (c.key === 'hist') {
      var id = row.v[7], n = row.h ? row.h.length : 0;
      if (!n) { td.textContent = '—'; td.className = 'muted'; return td; }
      var b = node('button', (open[id] ? '閉じる' : n + '件'), 'hist-btn'); b.type = 'button';
      b.setAttribute('aria-expanded', open[id] ? 'true' : 'false'); b.title = id + ' の変更履歴';
      b.addEventListener('click', function () { open[id] = !open[id]; render(); });
      td.append(b);
    } else if (c.key === 'reason') {
      td.textContent = row.reason; td.title = row.reason; td.className = 'reason';
    } else {
      td.textContent = row.v[c.key]; td.title = row.v[c.key];
      if (c.key === 1 || c.key === 3 || c.key === 7 || c.key === 8) td.className = 'mono';
    }
    return td;
  }

  /** 変更履歴（新しい順）：申請番号・決裁日時・区分・変わった項目 */
  function historyRow(row, span) {
    var tr = node('tr', undefined, 'detail'), td = node('td'); td.colSpan = span;
    var t = node('table', undefined, 'history'), head = node('tr');
    ['申請番号', '決裁日時（JST）', '区分', '変更内容'].forEach(function (h) { var th = node('th', h); th.scope = 'col'; head.append(th); });
    var thead = node('thead'); thead.append(head); var body = node('tbody');
    row.h.forEach(function (h) {
      var r = node('tr'); r.append(node('td', h.no), node('td', h.at || '—'), node('td', h.kind));
      var c = node('td'), ul = node('ul', undefined, 'changes');
      if (!h.changes.length) ul.append(node('li', '（表示項目の変更なし）'));
      h.changes.forEach(function (x) {
        var li = node('li'); li.append(node('span', x[0], 'chg-col'));
        if (h.kind === '新規登録') li.append(node('span', x[2] || '（空）', 'chg-after'));
        else li.append(node('span', x[1] || '（空）', 'chg-before'), node('span', '→', 'chg-arrow'), node('span', x[2] || '（空）', 'chg-after'));
        ul.append(li);
      });
      c.append(ul); r.append(c); body.append(r);
    });
    t.append(thead, body);
    var inner = node('div', undefined, 'detail-inner');
    inner.append(node('p', row.v[7] + '　' + row.v[0] + ' の変更履歴（自動反映の開始以降）', 'detail-title'), t);
    td.append(inner);
    tr.append(td);
    return tr;
  }

  function render() {
    if (!data) return;
    cols = PMV.columnsFor(tab, data);
    if (sortCol !== null && !cols.some(function (c) { return c.key === sortCol; })) { sortCol = null; sortDir = 'asc'; }
    renderHead(cols);
    applyWidths();
    var total = PMV.filter(data.rows, tab, '', {}).length;
    var list = PMV.sort(PMV.filter(data.rows, tab, el('q').value, filters()), sortCol, sortDir);
    var body = el('body'), frag = document.createDocumentFragment();
    list.forEach(function (r) {
      var tr = node('tr', undefined, r.s === '無効' ? 'inactive' : '');
      cols.forEach(function (c) { tr.append(cellNode(r, c)); });
      frag.append(tr);
      if (open[r.v[7]] && r.h && r.h.length) frag.append(historyRow(r, cols.length));
    });
    body.replaceChildren(frag);
    el('empty').hidden = list.length > 0;
    el('result-count').textContent = '表示 ' + list.length + ' / ' + total + ' 件';
  }

  function selectTab(t) {
    tab = t;
    document.querySelectorAll('[role=tab]').forEach(function (b) {
      var on = b.getAttribute('data-tab') === t;
      b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
      if (on) el('product-table').setAttribute('aria-labelledby', b.id);
    });
    render();
  }

  function load() {
    var current = ++seq; message('読み込み中…'); el('reload').disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      if (current !== seq) return; el('reload').disabled = false;
      if (!res || !res.ok) { message(res && res.error ? res.error : '表示できません。'); return; }
      data = res.data; message('');
      el('last-applied').textContent = data.lastApplied || '記録なし';
      el('read-at').textContent = data.readAt;
      ['active', 'inactive', 'all'].forEach(function (k) { el('count-' + k).textContent = data.counts[k]; });
      fillSelect('f-status', PMV.options(data.rows, 'status'));
      fillSelect('f-category', PMV.options(data.rows, 'category'));
      fillSelect('f-destination', PMV.options(data.rows, 'destination'));
      var w = data.warnings || [];
      el('warnings').hidden = !w.length; el('warning-count').textContent = '（' + w.length + '件）';
      el('warning-list').replaceChildren.apply(el('warning-list'), w.map(function (x) { return node('li', x); }));
      render();
    }).withFailureHandler(function () {
      if (current !== seq) return; el('reload').disabled = false;
      message('読み込みに失敗しました。再読込してください。');
    }).vmLoad();
  }

  document.querySelectorAll('[role=tab]').forEach(function (b, i, all) {
    b.addEventListener('click', function () { selectTab(b.getAttribute('data-tab')); });
    b.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
      var n = all[(i + d + all.length) % all.length]; n.focus(); selectTab(n.getAttribute('data-tab')); e.preventDefault();
    });
  });
  var timer = null;
  el('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(render, 120); });
  ['f-status', 'f-category', 'f-destination'].forEach(function (id) { el(id).addEventListener('change', render); });
  el('filters').addEventListener('submit', function (e) { e.preventDefault(); render(); });
  el('clear').addEventListener('click', function () { el('q').value = ''; ['f-status', 'f-category', 'f-destination'].forEach(function (id) { el(id).value = ''; }); render(); });
  el('reload').addEventListener('click', load);
  el('reset-widths').addEventListener('click', resetWidths);
  selectTab('active');
  load();
})();
</script>
